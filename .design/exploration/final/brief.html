<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning brief · Urja</title>
<link rel="stylesheet" href="urja.css">
<style>
  body { min-height: 100dvh; }
  .m { max-width: 480px; margin: 0 auto; padding: 0 16px 120px; }
  .m-top { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .m-top .wordmark { font-size: 1.05rem; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .lang button { min-width: 44px; height: 32px; border-radius: 999px; font-size: var(--t-sm); color: var(--fg-muted); }
  .lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .greet { margin-top: 18px; font-size: 1.05rem; color: var(--fg-muted); }
  .date { font-size: var(--t-sm); color: var(--fg-subtle); }
  .earned { margin-top: 18px; }
  .earned .lbl { font-size: var(--t-sm); color: var(--fg-muted); }
  .earned .big { font-size: clamp(2.8rem, 10vw + 0.5rem, 3.6rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-stretch: 92%; }
  .leak { margin-top: 10px; font-size: 1.12rem; font-weight: 560; }
  .m-sec { margin-top: 30px; }
  .m-sec h2 { font-size: 1.05rem; margin-bottom: 8px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 0; border-top: 1px solid var(--line-soft); min-height: 44px; }
  .item:last-of-type { border-bottom: 1px solid var(--line-soft); }
  .item .txt { grid-column: 1 / -1; font-size: 1.02rem; line-height: 1.45; }
  .item .amt { font-weight: 650; font-size: 1.05rem; }
  .item .plate { justify-self: start; }
  .item .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; font-size: var(--t-sm); color: var(--fg-muted); }
  .clean { margin-top: 14px; font-size: var(--t-sm); color: var(--fg-muted); }
  .clean b { color: var(--gain); font-weight: 600; }
  .month { margin-top: 26px; padding: 16px; border-radius: var(--r-lg); background: var(--surface-2); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .month .k { font-size: var(--t-xs); color: var(--fg-muted); }
  .month .v { font-size: 1.35rem; font-weight: 600; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line-soft); }
  .dock form { max-width: 448px; margin: 0 auto; display: flex; gap: 8px; }
  .dock input { flex: 1; height: 48px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-1); color: var(--fg); padding: 0 18px; font: inherit; }
  .dock .btn { height: 48px; border-radius: 999px; padding: 0 18px; }
</style>
</head>
<body class="theme-light">
<div class="proto-banner">DESIGN PROTOTYPE — NOT PRODUCTION</div>
<main class="m">
  <div class="m-top">
    <span class="wordmark"><svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--brand)"/><path d="M6.5 18a6.5 6.5 0 0 1 13 0" fill="none" stroke="var(--brand-ink)" stroke-width="2.2" stroke-linecap="round"/><path d="M13 18l4-6" stroke="var(--brand-ink)" stroke-width="2.2" stroke-linecap="round"/></svg>Urja</span>
    <div class="lang" role="group" aria-label="Language">
      <button data-set="hi" aria-pressed="true" lang="hi">हिं</button><button data-set="en" aria-pressed="false" lang="en">EN</button>
    </div>
  </div>

  <p class="greet" data-hi="सुप्रभात, शर्मा जी" data-en="Good morning, Sharma ji"></p>
  <p class="date" data-hi="सोमवार, 28 सितंबर · कल की 17 ट्रिप का हिसाब" data-en="Monday, 28 September · yesterday’s 17 trips reconciled"></p>

  <section class="earned" aria-live="polite">
    <p class="lbl" data-hi="कल की कमाई" data-en="Earned yesterday"></p>
    <p class="big gain">₹1,86,400</p>
    <p class="leak loss" data-hi="₹11,430 का हिसाब नहीं मिल रहा" data-en="₹11,430 doesn’t add up"></p>
  </section>

  <section class="m-sec">
    <h2 data-hi="इन 3 ट्रिप को देखें" data-en="Look at these 3 trips"></h2>
    <a class="item" href="trip.html">
      <span class="plate">RJ14 GB 4521</span><span class="amt loss">₹3,420</span>
      <span class="txt" data-hi="बहरोड़ के पास खड़े ट्रक में 38 L डीज़ल का हिसाब नहीं — रात 2:14 बजे" data-en="38 L diesel unaccounted while parked near Behror, 2:14 AM"></span>
      <span class="foot"><span class="conf" data-level="3"><i><b></b><b></b><b></b></i><span data-hi="पक्का" data-en="High"></span></span><span data-hi="रमेश से अभी नहीं पूछा ›" data-en="Ramesh not asked yet ›"></span></span>
    </a>
    <a class="item" href="trip.html">
      <span class="plate">RJ14 GA 1182</span><span class="amt loss">₹4,500</span>
      <span class="txt" data-hi="किशनगढ़ में बिल 250 L का, पर टंकी में सिर्फ़ 200 L बढ़ा" data-en="Fuel bill says 250 L, but the tank rose only 200 L — Kishangarh"></span>
      <span class="foot"><span class="conf" data-level="2"><i><b></b><b></b><b></b></i><span data-hi="शायद" data-en="Likely"></span></span><span data-hi="विक्रम ने जवाब दिया — देखें ›" data-en="Vikram replied — review ›"></span></span>
    </a>
    <a class="item" href="trip.html">
      <span class="plate">RJ14 GC 3309</span><span class="amt loss">₹3,510</span>
      <span class="txt" data-hi="भिवंडी ट्रिप में आम से 39 L ज़्यादा डीज़ल लगा" data-en="Used 39 L more diesel than usual on the Bhiwandi run"></span>
      <span class="foot"><span class="conf" data-level="1"><i><b></b><b></b><b></b></i><span data-hi="जाँचें" data-en="Check"></span></span><span data-hi="अनिल से अभी नहीं पूछा ›" data-en="Anil not asked yet ›"></span></span>
    </a>
    <p class="clean" data-hi="✓ बाकी <b>14 ट्रिप</b> का हिसाब ठीक है — डीज़ल, टोल और किलोमीटर सब मेल खाते हैं।" data-en="✓ The other <b>14 trips</b> add up — diesel, tolls and km all match."></p>
  </section>

  <section class="month" aria-label="September so far">
    <div><p class="k" data-hi="सितंबर में पकड़ा" data-en="Flagged in September"></p><p class="v">₹58,240</p></div>
    <div><p class="k" data-hi="वापस मिला" data-en="Recovered"></p><p class="v gain">₹21,600</p></div>
  </section>
</main>

<div class="dock">
  <form onsubmit="return false"><label for="q" style="position:absolute;left:-9999px">Ask Urja</label><input id="q" data-ph-hi="कुछ भी पूछें, हिंदी या English में…" data-ph-en="Ask anything, in Hindi or English…"><button class="btn btn-primary" data-hi="पूछें" data-en="Ask"></button></form>
</div>

<script>
  function setLang(l) {
    document.documentElement.lang = l;
    document.querySelectorAll('[data-hi]').forEach((el) => { el.innerHTML = el.dataset[l]; });
    document.querySelectorAll('[data-ph-hi]').forEach((el) => { el.placeholder = el.dataset['ph' + l[0].toUpperCase() + l.slice(1)]; });
    document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.set === l));
    document.body.classList.toggle('hi', l === 'hi');
  }
  document.querySelectorAll('.lang button').forEach((b) => b.onclick = () => setLang(b.dataset.set));
  setLang(new URLSearchParams(location.search).get('lang') || 'hi');
</script>
</body>
</html>
