<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>सुबह 7 बजे का संदेश · Urja</title>
<link rel="stylesheet" href="lamp.css">
</head>
<body class="hi">
<div class="proto-banner">DESIGN PROTOTYPE — NOT PRODUCTION</div>
<div class="chat">
  <div class="chat-top">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 26 26"><use href="#i-mark"/></svg></span>
    <div><b>Urja</b><small data-hi="Sharma Roadlines का हिसाब" data-en="Accounts for Sharma Roadlines"></small></div>
    <div class="lang" role="group" aria-label="Language / भाषा"><button data-set="hi" aria-pressed="true" lang="hi">हिं</button><button data-set="en" aria-pressed="false" lang="en">EN</button></div>
  </div>

  <div class="thread">
    <span class="day" data-hi="आज" data-en="Today"></span>
    <div class="bubble">
      <a class="pv" href="brief.html" aria-label="Open today’s brief">
        <span class="pv-art" aria-hidden="true">
          <span class="pv-title" data-hi="डीज़ल कहाँ गया?" data-en="Where did the diesel go?"></span>
          <svg viewBox="0 0 150 64"><g id="pvbars"></g></svg>
        </span>
        <span class="pv-meta"><b data-hi="आज का हिसाब · Sharma Roadlines" data-en="Today’s brief · Sharma Roadlines"></b>urja.app</span>
      </a>
      <div class="txt">
        <h3 data-hi="कल: ₹1,86,400 कमाए · ₹11,430 का हिसाब नहीं" data-en="Yesterday: ₹1,86,400 earned · ₹11,430 doesn’t add up"></h3>
        <p data-hi="17 ट्रिप पूरी हुईं। इन 3 को देखें:" data-en="17 trips finished. Look at these 3:"></p>
        <ol>
          <li data-hi="<b>RJ14 GB 4521</b> — बहरोड़ के पास, रात 2:14, खड़े ट्रक में 38 L डीज़ल कम। ₹3,420 · <b>पक्का</b>" data-en="<b>RJ14 GB 4521</b> — 38 L diesel down while parked near Behror, 2:14 AM. ₹3,420 · <b>High</b>"></li>
          <li data-hi="<b>RJ14 GA 1182</b> — बिल 250 L, टंकी में 200 L। ₹4,500 · <b>शायद</b>" data-en="<b>RJ14 GA 1182</b> — bill 250 L, tank rose 200 L. ₹4,500 · <b>Likely</b>"></li>
          <li data-hi="<b>RJ14 GC 3309</b> — भिवंडी ट्रिप में 39 L ज़्यादा डीज़ल। ₹3,510 · <b>जाँचें</b>" data-en="<b>RJ14 GC 3309</b> — 39 L more diesel than usual to Bhiwandi. ₹3,510 · <b>Check</b>"></li>
        </ol>
        <p data-hi="बाकी 14 ट्रिप ठीक हैं ✓" data-en="The other 14 trips are fine ✓"></p>
        <p class="meta">7:00</p>
      </div>
      <a class="act" href="brief.html"><span data-hi="पूरा हिसाब देखें" data-en="Open today’s brief"></span><svg class="i"><use href="#i-right"/></svg></a>
    </div>
    <div class="replies">
      <button data-hi="रमेश से पूछो" data-en="Ask Ramesh"></button>
      <button data-hi="सिर्फ़ पक्के वाले" data-en="Only high ones"></button>
    </div>
  </div>
  <p class="caption" data-hi="ऐसे WhatsApp पर सुबह 7 बजे आता है (डिज़ाइन प्रोटोटाइप)" data-en="How it arrives on WhatsApp at 7 AM (design prototype)"></p>
</div>
<script src="icons.js"></script>
<script>
  // the preview's little fuel trace: steady, the drop (red), refuel (lit)
  (() => {
    const g = document.getElementById('pvbars'); let s = '';
    const v = [44, 43, 43, 42, 42, 41, 41, 40, 40, 39, 36, 33, 30, 30, 29, 58, 57, 56, 55, 54];
    v.forEach((h, i) => {
      const c = i >= 10 && i <= 13 ? 'var(--loss)' : i === 15 ? 'var(--cream)' : 'oklch(0.48 0.008 60)';
      s += `<rect x="${i * 7.5}" y="${62 - h}" width="5.5" height="${h}" rx="1" style="fill:${c}"/>`;
    });
    g.innerHTML = s;
  })();
  function setLang(l) {
    document.documentElement.lang = l;
    document.querySelectorAll('[data-hi]').forEach((el) => { el.innerHTML = el.dataset[l]; });
    document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.set === l));
    document.body.classList.toggle('hi', l === 'hi');
  }
  document.querySelectorAll('.lang button').forEach((b) => b.onclick = () => setLang(b.dataset.set));
  setLang(new URLSearchParams(location.search).get('lang') || 'hi');
</script>
</body>
</html>
