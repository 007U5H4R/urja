<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image mockup · Urja</title>
<link rel="stylesheet" href="../final/urja.css">
<style>
  body { padding: 40px; display: grid; gap: 32px; justify-items: start; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; background: var(--bg); border: 1px solid var(--line-soft); padding: 72px 80px 88px; display: grid; }
  .og .inner { display: grid; grid-template-columns: 1fr 440px; gap: 48px; align-items: center; }
  .og .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 650; font-stretch: 110%; letter-spacing: -0.02em; }
  .og .brand svg { width: 48px; height: 48px; }
  .og h1 { font-size: 92px; line-height: .98; letter-spacing: -0.035em; font-weight: 580; margin-top: 44px; font-stretch: 94%; }
  .og .sub { font-size: 28px; color: var(--fg-muted); margin-top: 26px; line-height: 1.3; }
  .og .line { border: 1px solid var(--line); border-radius: 16px; padding: 26px; background: var(--surface-1); }
  .og .line .plate { height: 40px; font-size: 22px; padding: 0 12px; }
  .og .line .what { font-size: 32px; font-weight: 600; margin-top: 18px; line-height: 1.25; }
  .og .line .amt { font-size: 56px; font-weight: 650; letter-spacing: -0.03em; margin-top: 10px; }
  .og .line svg { width: 100%; margin-top: 14px; }
  .og .foot { position: absolute; left: 80px; bottom: 44px; font-size: 20px; color: var(--fg-subtle); }
  .thumb { transform: scale(.3); transform-origin: top left; width: 1200px; height: 630px; margin-bottom: -441px; }
  .lbl { font-size: 13px; color: var(--fg-subtle); }
</style>
</head>
<body>
<p class="lbl">OG image · 1200 × 630 · DESIGN PROTOTYPE — NOT PRODUCTION</p>
<div class="og" id="og">
  <div class="inner">
    <div>
      <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--brand)"/><path d="M6.5 18a6.5 6.5 0 0 1 13 0" fill="none" stroke="var(--brand-ink)" stroke-width="2.2" stroke-linecap="round"/><path d="M13 18l4-6" stroke="var(--brand-ink)" stroke-width="2.2" stroke-linecap="round"/></svg>Urja</div>
      <h1>Where did the diesel go?</h1>
      <p class="sub">Every trip reconciled by 7 AM, in Hindi or English.</p>
    </div>
    <div class="line">
      <span class="plate">RJ14 GB 4521</span>
      <p class="what">38 L unaccounted near Behror, 2:14 AM</p>
      <svg viewBox="0 0 400 110" aria-hidden="true">
        <polyline fill="none" stroke="var(--fg)" stroke-width="3" stroke-linejoin="round" points="0,30 150,42 190,42 230,80 260,82 400,95"/>
        <polyline fill="none" stroke="var(--fg-subtle)" stroke-width="2" stroke-dasharray="6 6" points="190,42 400,58"/>
        <rect x="190" y="0" width="40" height="110" fill="var(--loss-bg)"/>
        <circle cx="230" cy="80" r="6" fill="var(--loss)"/>
      </svg>
      <p class="amt loss">₹3,420</p>
    </div>
  </div>
  <p class="foot">An AI munshi for Indian fleet owners · a concept for Bytebeam</p>
</div>
<p class="lbl">Thumbnail test · 30%</p>
<div class="thumb"><div class="og" style="pointer-events:none" id="og2"></div></div>
<script>document.getElementById('og2').innerHTML = document.getElementById('og').innerHTML;</script>
</body>
</html>
