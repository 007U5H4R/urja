<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OG image mockup · Urja · Lamplight</title>
<link rel="stylesheet" href="../option-b/lamp.css">
<style>
  .og-page { padding: 32px clamp(16px, 3vw, 40px) 64px; display: grid; gap: 14px; }
  .og-page .lbl { font-size: 13px; color: var(--fg-muted); }
  .og-page .fit + .lbl { margin-top: 26px; }
  /* the card is always laid out at 1200 × 630; on narrow screens it is scaled down to fit, never scrolled */
  .fit { width: 100%; max-width: 1200px; overflow: hidden; }
  .fit.thumb { max-width: 360px; }

  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; transform-origin: 0 0;
    background: radial-gradient(760px 480px at 6% -10%, oklch(0.705 0.166 53 / .16), transparent 70%), var(--bg);
    outline: 1px solid var(--line-soft); outline-offset: -1px; }
  /* right-side backdrop: optional truck render; the lamplight holds the composition without it */
  .og .art { position: absolute; top: 0; right: 0; bottom: 0; width: 64%;
    background: radial-gradient(520px 400px at 60% 44%, oklch(0.705 0.166 53 / .22), transparent 70%),
                radial-gradient(340px 200px at 70% 100%, oklch(0.69 0.19 27 / .10), transparent 70%); }
  .og .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 42%); mask-image: linear-gradient(90deg, transparent, #000 42%); }
  .og .brand { position: absolute; left: 76px; top: 64px; display: flex; align-items: center; gap: 14px; font-size: 36px; font-weight: 620; letter-spacing: -0.02em; }
  .og .brand .mark { width: 46px; height: 46px; border-radius: 13px; }
  .og .brand .mark svg { width: 28px; height: 28px; }
  .og h1 { position: absolute; left: 76px; top: 50%; transform: translateY(-50%); width: 540px; font-size: 84px; font-weight: 400; line-height: 1; letter-spacing: -0.04em; text-wrap: balance;
    text-shadow: 0 0 40px oklch(0.705 0.166 53 / .30), 0 0 100px oklch(0.705 0.166 53 / .16); }
  .og .flag { position: absolute; right: 76px; top: 50%; transform: translateY(-50%); width: 470px; padding: 26px; border-radius: 20px; }
  .og .flag .plate { height: 46px; font-size: 27px; padding: 0 14px; border-radius: 7px; }
  .og .what { margin-top: 16px; font-size: 22px; line-height: 1.3; color: var(--fg-muted); }
  .og .fuel { height: 156px; margin-top: 18px; }
  .og .fuel svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .og .amt { margin-top: 16px; font-size: 66px; font-weight: 450; letter-spacing: -0.03em; line-height: 1; }
  .og .foot { position: absolute; left: 76px; bottom: 58px; font-size: 22px; color: var(--fg-muted); }
</style>
</head>
<body>
<div class="proto-banner">DESIGN PROTOTYPE — NOT PRODUCTION</div>
<main class="og-page">
  <p class="lbl">OG image · 1200 × 630 · direction B, Lamplight</p>
  <div class="fit" id="fitMain">
    <div class="og" id="og">
      <div class="art"><img src="../option-b/assets/truck-scene.png" alt="" onerror="this.style.display='none'"></div>
      <div class="brand"><span class="mark"><svg viewBox="0 0 26 26"><use href="#i-mark"/></svg></span>Urja</div>
      <h1>Where did the diesel go?</h1>
      <div class="glass flag">
        <span class="plate">RJ14 GB 4521</span>
        <p class="what">38 L unaccounted near Behror, 2:14 AM</p>
        <div class="fuel" role="img" aria-label="Fuel in the tank of RJ14 GB 4521 on the night of 26 to 27 September: a slow fall from 210 to 168 litres while driving, then a 38 litre drop to 130 litres while the truck was parked near Behror with speed at zero, then a 138 litre refuel that matches the bill. The trip ends at 230 litres."></div>
        <p class="amt lit-loss">₹3,420</p>
      </div>
      <p class="foot">An AI munshi for Indian fleet owners · a concept for Bytebeam</p>
    </div>
  </div>
  <p class="lbl">Thumbnail test · 30%</p>
  <div class="fit thumb" id="fitThumb" aria-hidden="true" inert><div class="og" id="og2"></div></div>
</main>

<script src="../option-b/icons.js"></script>
<script src="../option-b/charts.js"></script>
<script>
  // Fuel above the line, speed mirrored below it (the trip page's wave, in miniature):
  // dim = normal, red = the drop while parked, one lit bar = the refuel.
  function fuelDrop(el) {
    const id = 'og' + (fuelDrop.n = (fuelDrop.n || 0) + 1);
    const fuel = [210, 207, 204, 201, 198, 195, 192, 189, 185, 181, 176, 172, 168, 158, 148, 139, 130, 128, 266, 261, 254, 246, 238, 230];
    const speed = [52, 58, 55, 49, 54, 60, 57, 50, 55, 59, 53, 48, 31, 0, 0, 0, 0, 44, 0, 50, 57, 54, 58, 52];
    const kind = (i) => (i >= 13 && i <= 16 ? 'loss' : i === 18 ? 'hot' : 'dim');
    const W = 418, H = 156, axis = 110, topH = 102, botH = 36, FM = 280, gap = 5, n = fuel.length, bw = (W - gap * (n - 1)) / n;
    const x = (i) => i * (bw + gap);
    let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${_defs(id)}`;
    s += `<rect x="${(x(13) - gap / 2).toFixed(1)}" y="${axis - topH - 4}" width="${(4 * (bw + gap)).toFixed(1)}" height="${topH + botH + 12}" rx="6" style="fill:var(--loss-bg)"/>`;
    fuel.forEach((v, i) => {
      const h = (v / FM) * topH, k = kind(i), sh = (speed[i] / 60) * botH;
      s += `<rect x="${x(i).toFixed(2)}" y="${(axis - h).toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}" rx="2" fill="url(#${k}${id})"${k === 'hot' ? ` filter="url(#glow${id})"` : ''}/>`;
      if (sh > 0.5) s += `<rect x="${x(i).toFixed(2)}" y="${axis + 5}" width="${bw.toFixed(2)}" height="${sh.toFixed(2)}" rx="2" fill="url(#dimdown${id})"/>`;
    });
    s += `<line x1="0" x2="${W}" y1="${axis + 2.5}" y2="${axis + 2.5}" style="stroke:var(--line)"/>`;
    el.innerHTML = s + '</svg>';
  }
  const og = document.getElementById('og'), og2 = document.getElementById('og2');
  fuelDrop(og.querySelector('.fuel'));
  og2.innerHTML = og.innerHTML;
  fuelDrop(og2.querySelector('.fuel')); // redraw so the thumbnail's gradient ids stay unique
  function fit() {
    for (const [id, max] of [['fitMain', 1], ['fitThumb', 0.3]]) {
      const f = document.getElementById(id), k = Math.min(max, f.clientWidth / 1200);
      f.firstElementChild.style.transform = `scale(${k})`;
      f.style.height = `${Math.round(630 * k)}px`;
    }
  }
  fit();
  addEventListener('resize', fit);
</script>
</body>
</html>
